name: Validate JSON files
on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.json'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.json'
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: "pip"
      - name: Install dependencies
        run: pip install check-jsonschema==0.*
      - name: Validate JSON files
        # https://manpages.ubuntu.com/manpages/noble/man1/find.1.html
        # https://docs.python.org/3/library/json.html#module-json.tool
        run: |
          # Iterate over JSON data files
          shopt -s globstar
          for path in data/**/*.json
          do
            echo "$path"
            python -m json.tool "$path" "$(mktemp)"
          done
      - name: Validate JSON file contents using schemas
        run: |
          check-jsonschema --schemafile ./data/schemas/survey_config.schema.json ./data/survey_config/*_config*.json
