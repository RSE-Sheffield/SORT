name: Validate JSON files
on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.json'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.json'
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version
          cache: "pip"
      - name: Install dependencies
        run: pip install check-jsonschema==0.*
      - name: Validate JSON files
        # https://manpages.ubuntu.com/manpages/noble/man1/find.1.html
        # https://docs.python.org/3/library/json.html#module-json.tool
        run: |
          # Iterate over JSON data files
          shopt -s globstar
          for path in data/**/*.json
          do
            echo "$path"
            python -m json.tool "$path" "$(mktemp)"
          done
      - name: Validate JSON file contents using schemas
        run: |
          check-jsonschema --schemafile ./data/schemas/survey_config.schema.json ./data/survey_config/*_config*.json
