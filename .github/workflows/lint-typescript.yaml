# ESLint is a static code analysis tool for finding problems with ECMAScript/JavaScript code
# https://eslint.org/
name: Lint & test JavaScript code
on:
  push:
    branches: [ "main" ]
    paths:
      - ui_components/**
      - package*.json
      - tsconfig*.json
      - vite*.json
      - svelte*.json
      - .svelte-check-baseline
      - scripts/svelte_check_ratchet.sh
  pull_request:
    branches: [ "main" ]
    paths:
      - ui_components/**
      - package*.json
      - tsconfig*.json
      - vite*.json
      - svelte*.json
      - .svelte-check-baseline
      - scripts/svelte_check_ratchet.sh
permissions:
  contents: read
  pull-requests: write  # post coverage reports
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'package.json'
          cache-dependency-path: 'package-lock.json'
      - run: npm ci
      # https://eslint.org/docs/latest/use/command-line-interface
      # We also need the Svelte linter https://sveltejs.github.io/eslint-plugin-svelte/
      # This could be improved by using a configuration file
      # https://eslint.org/docs/latest/use/configure/configuration-files#configuration-file
      - name: Run linter
        run: npm run lint
      # svelte-check catches null/undefined dereferences that only show up at runtime,
      # such as reading a property of an optional field statistic. There is a backlog of
      # pre-existing errors, so this ratchets the count down rather than gating on zero.
      - name: Check TypeScript types
        run: scripts/svelte_check_ratchet.sh
      - name: Run test suite
        run: npm run test:coverage
      - name: Report coverage
        uses: davelosert/vitest-coverage-report-action@c4bbc33a89b7ace0e63d35f1f7d4bcee31155a73 # v2.13.0
        with:
          json-summary-path: ui_components/coverage/coverage-summary.json
          json-final-path: ui_components/coverage/coverage-final.json
