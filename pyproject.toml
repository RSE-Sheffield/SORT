[tool.black]
line-length = 120
target-version = ["py312"]
exclude = '''
/(
    migrations
  | node_modules
  | venv
  | env
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["migrations", "node_modules", "venv", "env"]

[tool.coverage.run]
source = ["."]
# Django's --parallel test runner forks worker processes; without these,
# coverage recorded inside those workers is lost instead of merged in by
# `coverage combine` (see .github/workflows/django-check.yaml).
parallel = true
concurrency = ["multiprocessing"]
omit = [
    "__init__.py",
    "*/migrations/*",
    "SORT/*",
    "*/admin.py",
    "*/tests/*",
    "e2e/*",
    "home/management/*",
    "survey/management/*",
]

[tool.coverage.report]
format = "markdown"
skip_empty = true
sort = "Cover"

[tool.bandit]
# Tests use asserts and hardcoded passwords, which are noise for a security scan.
exclude_dirs = ["node_modules", ".venv", "e2e", "home/tests", "survey/tests", "SORT/test"]

[tool.djlint]
profile = "django"
extension = "html"
# Rules ignored to keep the baseline green; remove from this list as templates are fixed.
# H030/H031: meta description/keywords. H021: inline styles. H023: entity references.
# H008, H014, H016, H020, H025, H029, H043, H054, T001, T002: existing findings to fix gradually.
ignore = "H030,H031,H021,H023,H008,H014,H016,H020,H025,H029,H043,H054,T001,T002"
exclude = "node_modules,.venv,venv,static,staticfiles"
